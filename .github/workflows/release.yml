name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate release version
      shell: bash
      run: |
        set -eu
        . ./VERSION
        [ "$GITHUB_REF_NAME" = "$VERSION" ] || {
          echo "Release tag must match VERSION"
          exit 1
        }

    - name: Build release notes
      shell: bash
      run: |
        set -eu
        . ./VERSION
        LAST=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$VERSION" | head -n1 || true)
        {
          echo "## $VERSION"
          echo ""
          echo "- commit: \`${GITHUB_SHA:0:10}\` ($GITHUB_REF_NAME)"
          echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo ""
          if [ -n "$LAST" ]; then
            echo "### Changes since $LAST"
            echo '```'
            git log --pretty=format:'%h %s (%an, %ad)' --date=short -n 50 "$LAST..$GITHUB_SHA"
          else
            echo "### Recent commits"
            echo '```'
            git log --pretty=format:'%h %s (%an, %ad)' --date=short -n 40
          fi
          echo
          echo '```'
        } > release-body.md
        if [ -f RELEASE_NOTES.md ]; then
          echo "" >> release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          cat RELEASE_NOTES.md >> release-body.md
        fi
        cat release-body.md

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Package release assets
      run: |
        cd toolkit_linux && zip -r ../toolkit_linux.zip . && cd ..
        cd toolkit_windows && zip -r ../toolkit_windows.zip . && cd ..
        cd toolkit_android && zip -r ../toolkit_android.zip . && cd ..
        cd magisk_module && zip -r ../magisk_module.zip . && cd ..
        cd vbmetafixer_linux && zip -r ../vbmetafixer_linux.zip . && cd ..
        cd vbmetafixer_windows && zip -r ../vbmetafixer_windows.zip . && cd ..
        cd vbmetafixer_android && zip -r ../vbmetafixer_android.zip . && cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        body_path: release-body.md
        files: |
          toolkit_linux.zip
          toolkit_windows.zip
          toolkit_android.zip
          magisk_module.zip
          vbmetafixer_linux.zip
          vbmetafixer_windows.zip
          vbmetafixer_android.zip
