name: Auto Release

on:
  push:
    branches: [ main, oneplus15 ]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read version
      id: ver
      shell: bash
      run: |
        set -eu
        . ./VERSION
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build release notes
      shell: bash
      run: |
        set -eu
        . ./VERSION
        LAST=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$VERSION" | head -n1 || true)
        {
          echo "## $VERSION"
          echo ""
          echo "- commit: \`${GITHUB_SHA:0:10}\` ($GITHUB_REF_NAME)"
          echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo ""
          if [ -n "$LAST" ]; then
            echo "### Changes since $LAST"
            echo '```'
            git log --pretty=format:'%h %s (%an, %ad)' --date=short -n 50 "$LAST..$GITHUB_SHA"
          else
            echo "### Recent commits"
            echo '```'
            git log --pretty=format:'%h %s (%an, %ad)' --date=short -n 40
          fi
          echo
          echo '```'
        } > release-body.md
        cat release-body.md

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Package release assets
      run: |
        cd toolkit_linux && zip -r ../toolkit_linux.zip . && cd ..
        cd toolkit_windows && zip -r ../toolkit_windows.zip . && cd ..
        cd toolkit_android && zip -r ../toolkit_android.zip . && cd ..
        cd magisk_module && zip -r ../magisk_module.zip . && cd ..
        cd vbmetafixer_linux && zip -r ../vbmetafixer_linux.zip . && cd ..
        cd vbmetafixer_windows && zip -r ../vbmetafixer_windows.zip . && cd ..
        cd vbmetafixer_android && zip -r ../vbmetafixer_android.zip . && cd ..
        # The two boot-volume files, also published standalone so they can be
        # dropped onto the persist partition without unpacking a toolkit.
        cp toolkit_linux/BDS.efi BDS.efi
        cp toolkit_linux/efisp/SfbKernelBoot.efi SfbKernelBoot.efi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ver.outputs.tag }}
        name: ${{ steps.ver.outputs.tag }}
        target_commitish: ${{ github.sha }}
        body_path: release-body.md
        files: |
          toolkit_linux.zip
          toolkit_windows.zip
          toolkit_android.zip
          magisk_module.zip
          vbmetafixer_linux.zip
          vbmetafixer_windows.zip
          vbmetafixer_android.zip
          BDS.efi
          SfbKernelBoot.efi
